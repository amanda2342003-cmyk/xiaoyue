    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    function getPredictSeasonForKy(kyNum) {
        if (STATIC_PREDICTIONS[kyNum]) {
            return STATIC_PREDICTIONS[kyNum];
        }
        const options = ["春", "夏", "秋", "冬"];
        let idx = (kyNum - 1) % 4;
        let p1 = options[idx];
        let p2 = options[(idx + 1) % 4];
        let p3 = options[(idx + 2) % 4];
        return p1 + p2 + p3;
    }

    function getSeasonByAnimal(animalStr) {
        for (let key in SEASON_MAP) {
            if (SEASON_MAP[key].includes(animalStr)) {
                return key;
            }
        }
        return "";
    }

    function formatTwoDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    async function initPredict() {
        try {
            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];
            let maxKyNum = 0;

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    let animalStr = '';
                    
                    // Lấy số kết quả
                    if (r[7] && r[7].v !== null && r[7].v !== undefined && String(r[7].v).trim() !== '' && String(r[7].v).trim() !== '00') {
                        numTeFormatted = formatTwoDigits(r[7].v);
                    }
                    // Lấy tên con giáp trực tiếp từ cột kế bên (nếu có sẵn trong sheet kết quả)
                    if (r[8] && r[8].v !== null && r[8].v !== undefined) {
                        animalStr = String(r[8].v).trim();
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted,
                            animal: animalStr
                        });
                        if (kyOnlyNum > maxKyNum) {
                            maxKyNum = kyOnlyNum;
                        }
                    }
                }
            }

            let doneList = [];
            let limitRange = Math.min(parsedList.length, 365);
            let startIndex = parsedList.length - limitRange;

            for (let i = startIndex; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '' && item.numTe !== '00';
                if (isDone) {
                    doneList.push(item);
                }
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predicted = getPredictSeasonForKy(item.kyNum);
                let actualKey = getSeasonByAnimal(item.animal);
                let isWin = actualKey !== "" && predicted.includes(actualKey);
                evaluatedDoneList.push({ item, isWin });
            }

            let checkLatestMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                } else {
                    break;
                }
            }

            let cutoffIndex = evaluatedDoneList.length;
            if (checkLatestMisses < 3) {
                let consecutiveMisses = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveMisses = 0;
                    }
                }
            }

            let nextKyNum = maxKyNum + 1;
            let predictNext = getPredictSeasonForKy(nextKyNum);
            let kyStrNext = String(nextKyNum).padStart(3, '0');

            let htmlNextKy = `<li><span style="font-size: 18px;">${kyStrNext}期:【四季生肖】『<span style="color: #FF0000">${predictNext}</span>』开：</span><span style="font-size: 18px; color: rgb(255, 0, 0);">？00</span><span style="font-size: 18px; color: rgb(0, 0, 0);">准</span></li>`;

            let historyOutputs = [];
            if (checkLatestMisses < 3) {
                for (let i = cutoffIndex; i < doneList.length; i++) {
                    let item = doneList[i];
                    let predicted = getPredictSeasonForKy(item.kyNum);
                    let actualKey = getSeasonByAnimal(item.animal);
                    let isWin = actualKey !== "" && predicted.includes(actualKey);

                    if (isWin) {
                        let resStrWin = item.animal + item.numTe;
                        let kyStr = String(item.kyNum).padStart(3, '0');
                        
                        let formattedPredict = "";
                        for (let char of predicted) {
                            if (char === actualKey) {
                                formattedPredict += `<span style="background-color: yellow; color: rgb(255, 0, 0);">${char}</span>`;
                            } else {
                                formattedPredict += char;
                            }
                        }

                        historyOutputs.push(`<li><span style="font-size: 18px;">${kyStr}期:【四季生肖】『<span style="color: #FF0000">${formattedPredict}</span>』开：</span><span style="font-size: 18px; color: rgb(255, 0, 0);">${resStrWin}</span><span style="font-size: 18px; color: rgb(0, 0, 0);">准</span></li>`);
                    }
                }
            }
            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = String(nextKyNum + 1).padStart(3, '0');
                let kyStr2 = String(nextKyNum + 2).padStart(3, '0');
                let defaultHtml1 = `<li><span style="font-size: 18px;">${kyStr1}期:【四季生肖】『<span style="color: #FF0000">發發發</span>』开：</span><span style="font-size: 18px; color: rgb(255, 0, 0);">？00</span><span style="font-size: 18px; color: rgb(0, 0, 0);">准</span></li>`;
                let defaultHtml2 = `<li><span style="font-size: 18px;">${kyStr2}期:【四季生肖】『<span style="color: #FF0000">發發發</span>』开：</span><span style="font-size: 18px; color: rgb(255, 0, 0);">？00</span><span style="font-size: 18px; color: rgb(0, 0, 0);">准</span></li>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = String(nextKyNum + 1).padStart(3, '0');
                let defaultHtmlExtra = `<li><span style="font-size: 18px;">${kyStrExtra}期:【四季生肖】『<span style="color: #FF0000">發發發</span>』开：</span><span style="font-size: 18px; color: rgb(255, 0, 0);">？00</span><span style="font-size: 18px; color: rgb(0, 0, 0);">准</span></li>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
