    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    function getPredictQinQiShuHuaForKy(kyNum) {
        let actualKy = ((kyNum - 1) % 366) + 1;
        if (STATIC_PREDICTIONS[actualKy]) {
            return STATIC_PREDICTIONS[actualKy];
        }
        const options = ["琴", "棋", "书", "画"];
        let idx = (actualKy - 1) % 4;
        let p1 = options[idx];
        let p2 = options[(idx + 1) % 4];
        let p3 = options[(idx + 2) % 4];
        return p1 + p2 + p3;
    }

    function getQinQiShuHuaByAnimal(animalStr) {
        for (let key in QINQISHUHUAH_MAP) {
            if (QINQISHUHUAH_MAP[key].includes(animalStr)) {
                return key;
            }
        }
        return "";
    }

    function formatTwoDigits(val) {
        let cleanVal = String(val).trim();
        let num = parseInt(cleanVal.replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined) {
                        let valStr = String(r[7].v).trim();
                        if (valStr !== '' && valStr !== '0' && valStr !== '00') {
                            numTeFormatted = formatTwoDigits(valStr);
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '' && item.numTe !== '00';
                if (isDone) {
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predicted = getPredictQinQiShuHuaForKy(item.kyNum);
                let animalWin = duLieuMap[item.numTe] || '';
                let actualKey = getQinQiShuHuaByAnimal(animalWin);
                let isWin = actualKey !== "" && predicted.includes(actualKey);
                evaluatedDoneList.push({ item, isWin, animalWin, actualKey });
            }

            let checkLatestMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                } else {
                    break;
                }
            }

            let cutoffIndex = 0;
            if (checkLatestMisses < 3) {
                let consecutiveMisses = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveMisses = 0;
                    }
                }
            } else {
                cutoffIndex = evaluatedDoneList.length;
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictQinQiShuHuaForKy(nextKyNum);
            let kyStrNext = formatThreeDigits(nextKyNum);

            let htmlNextKy = `<p><span style="font-size: 18px;">${kyStrNext}期<span style="font-size: 14pt;">:琴棋书画→〆<span style="color: #FF0000">${predictNext}</span>〥开：</span><span style="color: rgb(255, 0, 0); font-size: 14pt;">？00</span><span style="color: rgb(0, 0, 0); font-size: 14pt;">准</span></span></p>`;

            let historyOutputs = [];
            if (checkLatestMisses < 3) {
                for (let i = cutoffIndex; i < evaluatedDoneList.length; i++) {
                    let evalItem = evaluatedDoneList[i];
                    let item = evalItem.item;

                    if (evalItem.isWin) {
                        let predicted = getPredictQinQiShuHuaForKy(item.kyNum);
                        let resStrWin = evalItem.animalWin + item.numTe;
                        let kyStr = formatThreeDigits(item.kyNum);
                        
                        let formattedPredict = "";
                        for (let char of predicted) {
                            if (char === evalItem.actualKey) {
                                formattedPredict += `<span style="background-color: yellow; color: rgb(255, 0, 0);">${char}</span>`;
                            } else {
                                formattedPredict += char;
                            }
                        }

                        historyOutputs.push(`<p><span style="font-size: 18px;">${kyStr}期<span style="font-size: 14pt;">:琴棋书画→〆<span style="color: #FF0000">${formattedPredict}</span>〥开：</span><span style="color: rgb(255, 0, 0); font-size: 14pt;">${resStrWin}</span><span style="color: rgb(0, 0, 0); font-size: 14pt;">准</span></span></p>`);
                    }
                }
            }
            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p><span style="font-size: 18px;">${kyStr1}期<span style="font-size: 14pt;">:琴棋书画→〆<span style="color: #FF0000">發發發</span>〥开：</span><span style="color: rgb(255, 0, 0); font-size: 14pt;">？00</span><span style="color: rgb(0, 0, 0); font-size: 14pt;">准</span></span></p>`;
                let defaultHtml2 = `<p><span style="font-size: 18px;">${kyStr2}期<span style="font-size: 14pt;">:琴棋书画→〆<span style="color: #FF0000">發發發</span>〥开：</span><span style="color: rgb(255, 0, 0); font-size: 14pt;">？00</span><span style="color: rgb(0, 0, 0); font-size: 14pt;">准</span></span></p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p><span style="font-size: 18px;">${kyStrExtra}期<span style="font-size: 14pt;">:琴棋书画→〆<span style="color: #FF0000">發發發</span>〥开：</span><span style="color: rgb(255, 0, 0); font-size: 14pt;">？00</span><span style="color: rgb(0, 0, 0); font-size: 14pt;">准</span></span></p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
