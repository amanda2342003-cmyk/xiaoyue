    <style>
        body {
            margin: 0;

            background-color: #fff;

        .win-animal {
            color: #FF0000;
            background-color: yellow;
        }

<div id="content-container" class="content"></div>

<script>

    const SHEET_NAME_KQ = 'KQ_AOMEN';
    const SHEET_NAME_DULIEU = 'DULIEU';

    const URL_KQ = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME_KQ}&_=${Date.now()}`;

    const PREDICT_LIST = [

        "大数+2头", "小数+3头", "小数+4头", "大数+1头", "大数+0头", "小数+3头", "大数+2头", "小数+4头", "大数+0头", "小数+2头",
        "小数+3头", "大数+1头", "小数+2头", "大数+0头", "大数+1头", "小数+4头", "大数+0头", "小数+2头", "小数+3头", "大数+1头",
        "小数+2头", "小数+4头", "大数+0头", "大数+2头", "小数+3头", "小数+4头", "大数+1头", "大数+0头", "小数+2头", "大数+1头",
        "大数+0头", "小数+4头", "大数+1头", "小数+3头", "大数+2头", "小数+4头", "大数+0头", "大数+1头", "小数+2头", "小数+4头",

        "大数+0头", "小数+2头", "大数+1头", "大数+0头", "小数+2头", "小数+4头", "大数+1头", "小数+3头", "小数+4头", "大数+0头",
        "小数+3头", "小数+2头", "大数+1头", "小数+3头", "小数+4头", "大数+0头", "小数+2头", "小数+4头", "大数+0头", "大数+1头",
        "小数+3头", "大数+2头", "大数+1头", "小数+3头", "小数+2头", "大数+1头", "大数+0头", "小数+3头", "小数+2头", "大数+0头",
        "大数+1头", "小数+3头", "小数+4头", "大数+1头", "小数+3头", "大数+2头", "大数+0头", "小数+3头", "小数+4头", "大数+0头",
        "大数+1头", "小数+2头", "大数+0头", "大数+1头", "小数+3头", "大数+2头", "小数+4头", "大数+1头", "大数+0头", "小数+4头",
        "小数+3头", "大数+2头", "小数+4头", "小数+3头", "大数+0头", "小数+4头", "大数+1头", "大数+2头", "小数+4头", "小数+3头",
        "大数+0头", "大数+2头", "小数+4头", "小数+3头", "大数+1头", "大数+0头", "小数+4头", "小数+2头", "大数+1头", "大数+0头",
        "小数+2头", "大数+1头", "大数+0头", "小数+3头", "大数+1头", "小数+2头", "大数+0头", "小数+4头", "小数+3头", "大数+1头",
        "大数+0头", "小数+4头", "小数+2头", "大数+0头", "大数+1头", "小数+3头", "大数+2头", "大数+0头", "小数+3头", "小数+4头",
        "大数+1头", "大数+0头", "小数+2头", "大数+1头", "小数+4头", "小数+3头", "大数+1头", "小数+2头", "小数+4头", "大数+1头",
        "小数+2头", "大数+0头", "大数+1头", "小数+2头", "大数+0头", "大数+1头", "小数+3头", "小数+4头", "大数+2头", "大数+1头",
        "小数+3头", "大数+2头", "小数+4头", "小数+3头", "大数+0头", "大数+1头", "小数+4头", "大数+2头", "小数+3头", "小数+4头",
        "大数+1头", "大数+0头", "小数+4头", "小数+3头", "大数+2头", "大数+0头", "小数+4头", "大数+1头", "小数+3头", "小数+2头",
        "大数+1头", "大数+0头", "小数+2头", "大数+1头", "小数+4头", "小数+2头", "大数+1头", "小数+4头", "小数+3头", "大数+0头",
        "小数+4头", "小数+2头", "大数+1头", "大数+0头", "小数+3头", "大数+1头", "小数+4头", "小数+3头", "大数+2头", "大数+1头",
        "小数+4头", "小数+2头", "大数+0头", "小数+4头", "小数+3头", "大数+2头", "小数+4头", "小数+3头", "大数+2头", "小数+4头",
        "大数+0头", "大数+2头", "小数+4头", "大数+0头", "大数+2头", "小数+4头", "小数+3头", "大数+1头", "大数+0头", "小数+2头",
        "大数+1头", "小数+3头", "大数+0头", "大数+1头", "小数+3头", "大数+2头", "大数+1头", "小数+4头", "小数+2头", "大数+1头",
        "大数+0头", "大数+1头", "小数+4头", "大数+0头", "大数+2头", "小数+3头", "小数+4头", "大数+0头", "小数+2头", "大数+1头",
        "小数+3头", "小数+4头", "大数+0头", "大数+2头", "小数+3头", "小数+4头", "大数+2头", "小数+3头", "小数+4头", "大数+2头",
        "大数+1头", "小数+4头", "大数+2头", "大数+0头", "小数+4头", "小数+2头", "大数+0头", "大数+1头", "小数+2头", "小数+3头",
        "大数+0头", "大数+1头", "小数+2头", "小数+3头", "大数+0头", "小数+2头", "大数+1头", "小数+3头", "大数+0头", "大数+1头",
        "小数+2头", "小数+3头", "大数+1头", "大数+0头", "小数+2头", "大数+1头", "大数+0头", "小数+3头", "大数+1头", "小数+4头",
        "小数+2头", "大数+0头", "小数+4头", "大数+1头", "大数+2头", "小数+3头", "小数+4头", "大数+0头", "大数+1头", "小数+2头",
        "大数+0头", "小数+4头", "大数+2头", "小数+3头", "小数+4头", "大数+2头"
    ];

    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    function getPredictDanShuangForKy(kyNum) {
        if (kyNum >= 1 && kyNum <= PREDICT_LIST.length) {
            return PREDICT_LIST[kyNum - 1];
        }
        let index = (kyNum - 1) % PREDICT_LIST.length;
        return PREDICT_LIST[index];
    }

    function formatTwoDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

    function checkWin(predicted, numStr) {
        let num = parseInt(numStr, 10);
        if (isNaN(num)) return false;
        
        let parts = predicted.split('+');
        let daXiaoPart = parts[0];
        let touPart = parts[1];

        let hitDaXiao = false;
        if (daXiaoPart === "小数" && num >= 1 && num <= 24) hitDaXiao = true;
        if (daXiaoPart === "大数" && num >= 25 && num <= 49) hitDaXiao = true;

        let hitTou = false;
        if (touPart === "0头" && num >= 1 && num <= 9) hitTou = true;
        if (touPart === "1头" && num >= 10 && num <= 19) hitTou = true;
        if (touPart === "2头" && num >= 20 && num <= 29) hitTou = true;
        if (touPart === "3头" && num >= 30 && num <= 39) hitTou = true;
        if (touPart === "4头" && num >= 40 && num <= 49) hitTou = true;

        return hitDaXiao || hitTou;
    }

    function renderPredictedHtml(predicted, numStr, isWin) {
        let parts = predicted.split('+');
        let daXiaoPart = parts[0];
        let touPart = parts[1];
        let num = parseInt(numStr, 10);

        let daXiaoHtml = daXiaoPart;
        let touHtml = touPart;

        if (isWin && !isNaN(num)) {
            let hitDaXiao = false;
            if (daXiaoPart === "小数" && num >= 1 && num <= 24) hitDaXiao = true;
            if (daXiaoPart === "大数" && num >= 25 && num <= 49) hitDaXiao = true;

            let hitTou = false;
            if (touPart === "0头" && num >= 1 && num <= 9) hitTou = true;
            if (touPart === "1头" && num >= 10 && num <= 19) hitTou = true;
            if (touPart === "2头" && num >= 20 && num <= 29) hitTou = true;
            if (touPart === "3头" && num >= 30 && num <= 39) hitTou = true;
            if (touPart === "4头" && num >= 40 && num <= 49) hitTou = true;

            if (hitDaXiao) {
                daXiaoHtml = `<span class="win-animal">${daXiaoPart}</span>`;
            }
            if (hitTou) {
                touHtml = `<span class="win-animal">${touPart}</span>`;
            }
        }

        return `${daXiaoHtml}+${touHtml}`;
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined && String(r[7].v).trim() !== '') {
                        numTeFormatted = formatTwoDigits(r[7].v);
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            // Phân loại doneList và pendingKyObj theo chuẩn mã mẫu
            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isNotDone = item.numTe === '' || item.numTe === '0' || item.numTe === '00';
                if (!isNotDone) {
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            // Tính toán kỳ dự đoán tiếp theo
            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            // Đánh giá kết quả các kỳ đã ra
            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predicted = getPredictDanShuangForKy(item.kyNum);
                let isWin = checkWin(predicted, item.numTe);
                evaluatedDoneList.push({ item, isWin });
            }

            // Kiểm tra chuỗi 3 kỳ thua gần nhất
            let checkLatestMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                } else {
                    break;
                }
            }

            // Xử lý cắt lịch sử khi có 3 kỳ thua liên tiếp
            let cutoffIndex = 0;
            if (checkLatestMisses < 3) {
                let consecutiveMisses = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveMisses = 0;
                    }
                }
            } else {
                cutoffIndex = evaluatedDoneList.length;
            }

            // Hiển thị kỳ cần dự đoán
            let nextKyNum = targetPredictKy;
            let predictNext = getPredictDanShuangForKy(nextKyNum);
            let kyStrNext = formatThreeDigits(nextKyNum);
            let htmlNextKy = `<p style="font-family:-apple-system-font,sans-serif;color:#333333;">${kyStrNext}期：<span style="color:rgb(128,0,128);">大小中特</span>＄【<span style="color:#ff0000;">${predictNext}</span>】<span style="color:#0000ff;">開：</span><span style="color:#ff0000;">？00准</span></p>`;

            // Hiển thị lịch sử các kỳ thắng
            let historyOutputs = [];
            if (checkLatestMisses < 3) {
                for (let i = cutoffIndex; i < evaluatedDoneList.length; i++) {
                    let evalItem = evaluatedDoneList[i];
                    let item = evalItem.item;
                    let predicted = getPredictDanShuangForKy(item.kyNum);
                    let shengXiaoWin = duLieuMap[item.numTe] || '';
                    
                    if (evalItem.isWin) {
                        let resStrWin = shengXiaoWin + item.numTe + '准';
                        let kyStr = formatThreeDigits(item.kyNum);
                        let formattedPredictHtml = renderPredictedHtml(predicted, item.numTe, evalItem.isWin);
                        historyOutputs.push(`<p style="font-family:-apple-system-font,sans-serif;color:#333333;">${kyStr}期：<span style="color:rgb(128,0,128);">大小中特</span>＄【<span style="color:#ff0000;">${formattedPredictHtml}</span>】<span style="color:#0000ff;">開：</span><span style="color:#ff0000;">${resStrWin}</span></p>`);
                    }
                }
            }

            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            // Bổ sung các kỳ giả định 【發發+$头】 khi lịch sử trống hoặc không đủ 3 dòng
            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p style="font-family:-apple-system-font,sans-serif;color:#333333;">${kyStr1}期：<span style="color:rgb(128,0,128);">大小中特</span>＄【<span style="color:#ff0000;">發發+$头</span>】<span style="color:#0000ff;">開：</span><span style="color:#ff0000;">？00准</span></p>`;
                let defaultHtml2 = `<p style="font-family:-apple-system-font,sans-serif;color:#333333;">${kyStr2}期：<span style="color:rgb(128,0,128);">大小中特</span>＄【<span style="color:#ff0000;">發發+$头</span>】<span style="color:#0000ff;">開：</span><span style="color:#ff0000;">？00准</span></p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p style="font-family:-apple-system-font,sans-serif;color:#333333;">${kyStrExtra}期：<span style="color:rgb(128,0,128);">大小中特</span>＄【<span style="color:#ff0000;">發發+發發</span>】<span style="color:#0000ff;">開：</span><span style="color:#ff0000;">？00准</span></p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
    initPredict();
</script>

</body>
</html>
