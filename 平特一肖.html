    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    function getPredictForKy(kyNum) {
        let actualKy = ((kyNum - 1) % 366) + 1;
        return STATIC_PREDICTIONS[actualKy] || "虎虎虎";
    }

    function formatTwoDigits(val) {
        let cleanVal = String(val).trim();
        let num = parseInt(cleanVal.replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];
            let maxKyNum = 0;

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numbersInDraw = [];
                    for (let colIdx = 1; colIdx <= 7; colIdx++) {
                        if (r[colIdx] && r[colIdx].v !== null && r[colIdx].v !== undefined) {
                            let valStr = String(r[colIdx].v).trim();
                            if (valStr !== '' && valStr !== '00') {
                                let formatted = formatTwoDigits(valStr);
                                if (formatted) {
                                    numbersInDraw.push(formatted);
                                }
                            }
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            drawNumbers: numbersInDraw
                        });
                        if (kyOnlyNum > maxKyNum) {
                            maxKyNum = kyOnlyNum;
                        }
                    }
                }
            }

            let doneList = [];
            let limitRange = Math.min(parsedList.length, 366);
            let startIndex = parsedList.length - limitRange;

            for (let i = startIndex; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.drawNumbers && item.drawNumbers.length > 0;
                if (isDone) {
                    doneList.push(item);
                }
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predicted = getPredictForKy(item.kyNum);
                let targetAnimal = predicted[0];
                let isWin = false;

                for (let numStr of item.drawNumbers) {
                    let numVal = parseInt(numStr, 10);
                    if (!isNaN(numVal) && numVal >= 1 && numVal <= 49) {
                        let animalOfNum = duLieuMap[numStr] || '';
                        if (animalOfNum === targetAnimal) {
                            isWin = true;
                            break;
                        }
                    }
                }
                
                evaluatedDoneList.push({ item, isWin, targetAnimal });
            }

            let cutoffIndex = 0;
            let consecutiveMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    consecutiveMisses++;
                    if (consecutiveMisses >= 3) {
                        cutoffIndex = i + 1;
                        break;
                    }
                } else {
                    consecutiveMisses = 0;
                }
            }

            let nextKyNum = maxKyNum + 1;
            let predictNext = getPredictForKy(nextKyNum);
            let kyStrNext = String(nextKyNum).padStart(3, '0');

            let htmlNextKy = `<p style="font-family:-apple-system-font,'Helvetica Neue',sans-serif;font-size:16px;"><span style="color:#333333;">${kyStrNext}期:</span><span style="color:#0000ff;">平特①肖</span><span style="color:#333333;">〖</span><span style="color:#ff0000;">${predictNext}</span><span style="color:#333333;">〗开:</span><span style="color:rgb(255,0,0);">？00准</span></p>`;

            let historyOutputs = [];
            for (let i = cutoffIndex; i < evaluatedDoneList.length; i++) {
                let evalItem = evaluatedDoneList[i];
                let item = evalItem.item;

                if (evalItem.isWin) {
                    let predicted = getPredictForKy(item.kyNum);
                    let kyStr = String(item.kyNum).padStart(3, '0');
                    
                    let winningNumStr = "";
                    for (let numStr of item.drawNumbers) {
                        let numVal = parseInt(numStr, 10);
                        if (!isNaN(numVal) && numVal >= 1 && numVal <= 49) {
                            if ((duLieuMap[numStr] || '') === evalItem.targetAnimal) {
                                winningNumStr = numStr;
                                break;
                            }
                        }
                    }
                    if (!winningNumStr && item.drawNumbers.length > 0) {
                        winningNumStr = item.drawNumbers[0];
                    }

                    let resStrWin = evalItem.targetAnimal + winningNumStr + '准';
                    historyOutputs.push(`<p style="font-family:-apple-system-font,'Helvetica Neue',sans-serif;font-size:16px;"><span style="color:#333333;">${kyStr}期:</span><span style="color:#0000ff;">平特①肖</span><span style="color:#333333;">〖</span><span style="background-color: yellow; color: #FF0000;">${predicted}</span><span style="color:#333333;">〗开:</span><span style="color:rgb(255,0,0);">${resStrWin}</span></p>`);
                }
            }
            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = String(nextKyNum + 1).padStart(3, '0');
                let kyStr2 = String(nextKyNum + 2).padStart(3, '0');
                let defaultHtml1 = `<p style="font-family:-apple-system-font,'Helvetica Neue',sans-serif;font-size:16px;"><span style="color:#333333;">${kyStr1}期:</span><span style="color:#0000ff;">平特①肖</span><span style="color:#333333;">〖</span><span style="color:#ff0000;">發發發</span><span style="color:#333333;">〗开:</span><span style="color:rgb(255,0,0);">？00准</span></p>`;
                let defaultHtml2 = `<p style="font-family:-apple-system-font,'Helvetica Neue',sans-serif;font-size:16px;"><span style="color:#333333;">${kyStr2}期:</span><span style="color:#0000ff;">平特①肖</span><span style="color:#333333;">〖</span><span style="color:#ff0000;">發發發</span><span style="color:#333333;">〗开:</span><span style="color:rgb(255,0,0);">？00准</span></p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = String(nextKyNum + 1).padStart(3, '0');
                let defaultHtmlExtra = `<p style="font-family:-apple-system-font,'Helvetica Neue',sans-serif;font-size:16px;"><span style="color:#333333;">${kyStrExtra}期:</span><span style="color:#0000ff;">平特①肖</span><span style="color:#333333;">〖</span><span style="color:#ff0000;">發發發</span><span style="color:#333333;">〗开:</span><span style="color:rgb(255,0,0);">？00准</span></p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
