        364: ["龙","猴","虎","羊","兔","鸡"], 365: ["鼠","虎","龙","蛇","猪","羊"]
    };

    let duLieuMap = {};

    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error("Lỗi kết nối");
            });
    }

    function getPredict6ForKy(kyNum) {
        if (PREDICT_DATABASE[kyNum]) {
            return PREDICT_DATABASE[kyNum];
        }
        let chanIdx = (kyNum * 2) % CHAN_BASE.length;
        let leIdx = (kyNum * 3) % LE_BASE.length;
        let chanArr = [CHAN_BASE[chanIdx], CHAN_BASE[(chanIdx + 2) % 6], CHAN_BASE[(chanIdx + 4) % 6]];
        let leArr = [LE_BASE[leIdx], LE_BASE[(leIdx + 2) % 6], LE_BASE[(leIdx + 4) % 6]];
        return [...chanArr, ...leArr];
    }

    function formatTwoDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function extractAnimal(rowCells) {
        for (let cell of rowCells) {
            if (!cell || cell.v === null) continue;
            let str = String(cell.v);
            for (let animal of ALL_ANIMALS) {
                if (str.includes(animal)) return animal;
            }
        }
        return '';
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animal = extractAnimal(r.c);
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];
            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r || !r[0] || r[0].v === null) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && String(r[7].v).trim() !== '' && String(r[7].v).trim() !== '00') {
                        numTeFormatted = formatTwoDigits(r[7].v);
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            let historyOutputs = [];
            let consecutiveMisses = 0;

            for (let item of parsedList) {
                let predicted6 = getPredict6ForKy(item.kyNum);
                let isDone = item.numTe !== '' && item.numTe !== '00';

                if (isDone) {
                    let shengXiaoWin = duLieuMap[item.numTe] || '';
                    let isWin = shengXiaoWin && predicted6.includes(shengXiaoWin);

                    if (isWin) {
                        consecutiveMisses = 0;
                        let formattedPredictArray = predicted6.map(animal => {
                            if (animal === shengXiaoWin) {
                                return `<span class="win-animal">${animal}</span>`;
                            }
                            return animal;
                        });

                        let chan3Str = formattedPredictArray.slice(0, 3).join('');
                        let le3Str = formattedPredictArray.slice(3, 6).join('');
                        let formatPredict = '【' + chan3Str + '+' + le3Str + '】';

                        let resStr = shengXiaoWin + item.numTe + '中';
                        historyOutputs.push('<p><span style="font-size: 16px;">' + String(item.kyNum).padStart(3, '0') + '期:' + formatPredict + '  开:</span><span class="res-box" style="font-size: 16px; color: rgb(255, 0, 0);">' + resStr + '</span></p>');
                    } else {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            historyOutputs = [];
                        }
                    }
                }
            }

            let maxKyNum = parsedList.length > 0 ? parsedList[parsedList.length - 1].kyNum : 0;
            
            let ky1 = maxKyNum + 1;
            let ky2 = maxKyNum + 2;
            let ky3 = maxKyNum + 3;

            let predictKy1 = getPredict6ForKy(ky1);
            let chan1 = predictKy1.slice(0, 3).join('');
            let le1 = predictKy1.slice(3, 6).join('');
            let formatPredictKy1 = '【' + chan1 + '+' + le1 + '】';

            let htmlKy1 = '<p><span style="font-size: 16px;">' + String(ky1).padStart(3, '0') + '期:' + formatPredictKy1 + '  开:</span><span class="res-box" style="font-size: 16px; color: rgb(255, 0, 0);">\uFF1F00中</span></p>';
            let htmlKy2 = '<p><span style="font-size: 16px;">' + String(ky2).padStart(3, '0') + '期:【發發發+發發發】 开:</span><span class="res-box" style="font-size: 16px; color: rgb(255, 0, 0);">\uFF1F00中</span></p>';
            let htmlKy3 = '<p><span style="font-size: 16px;">' + String(ky3).padStart(3, '0') + '期:【發發發+發發發】 开:</span><span class="res-box" style="font-size: 16px; color: rgb(255, 0, 0);">\uFF1F00中</span></p>';

            historyOutputs.reverse();

            let finalHtml = htmlKy3 + htmlKy2 + htmlKy1 + historyOutputs.join('');
            document.getElementById('content-container').innerHTML = finalHtml;

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = 'Lỗi kết nối dữ liệu!';
        }
    }
    initPredict();
</script>
