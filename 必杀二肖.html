    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    function getPredictDanShuangForKy(kyNum) {
        let actualKy = ((kyNum - 1) % 366) + 1;
        return STATIC_PREDICTIONS[actualKy] || "鼠牛";
    }

    function formatTwoDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];
            let maxKyNum = 0;

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined && String(r[7].v).trim() !== '' && String(r[7].v).trim() !== '00') {
                        numTeFormatted = formatTwoDigits(r[7].v);
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                        if (kyOnlyNum > maxKyNum) {
                            maxKyNum = kyOnlyNum;
                        }
                    }
                }
            }

            let doneList = [];
            let limitRange = Math.min(parsedList.length, 365);
            let startIndex = parsedList.length - limitRange;

            for (let i = startIndex; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '' && item.numTe !== '00';
                if (isDone) {
                    doneList.push(item);
                }
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predicted = getPredictDanShuangForKy(item.kyNum);
                let animal1 = predicted[0];
                let animal2 = predicted[1];
                let actualAnimal = duLieuMap[item.numTe] || '';
                let isValidNum = duLieuMap.hasOwnProperty(item.numTe);
                
                // Đoán sai kết quả (tức kết quả ra con khác 2 con cấm) -> Giữ lại (isWin = true)
                // Đoán đúng kết quả (tức kết quả trúng 1 trong 2 con cấm) -> Bị xóa (isWin = false)
                let isWin = isValidNum && actualAnimal && (actualAnimal !== animal1 && actualAnimal !== animal2);

                evaluatedDoneList.push({ item, isWin });
            }

            // Kiểm tra: Quá 3 kỳ liên tiếp bị xóa (isWin === false) thì xóa hết đi bắt đầu lại từ đầu
            let checkLatestDeletes = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestDeletes++;
                } else {
                    break;
                }
            }

            let cutoffIndex = 0;
            if (checkLatestDeletes >= 3) {
                cutoffIndex = evaluatedDoneList.length;
            } else {
                let consecutiveDeletes = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveDeletes++;
                        if (consecutiveDeletes >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveDeletes = 0;
                    }
                }
            }

            let nextKyNum = maxKyNum + 1;
            let predictNext = getPredictDanShuangForKy(nextKyNum);
            let kyStrNext = String(nextKyNum).padStart(3, '0');

            let htmlNextKy = `<p style="font-family:-apple-system-font,sans-serif;font-size:16px;"><span style="color:#333333;">${kyStrNext}期:</span><span style="color:rgb(255,0,255);">|绝杀二肖|</span><span style="color:rgb(0,128,0);">【<strong>${predictNext}</strong>】</span><span style="color:#333333;">━开</span><span style="color:#008000;">:</span><span style="color:#ff0000;">？00准</span></p>`;

            let historyOutputs = [];
            if (cutoffIndex < doneList.length) {
                for (let i = cutoffIndex; i < doneList.length; i++) {
                    let item = doneList[i];
                    let evaluated = evaluatedDoneList.find(e => e.item.kyNum === item.kyNum);
                    if (evaluated && evaluated.isWin) {
                        let predicted = getPredictDanShuangForKy(item.kyNum);
                        let shengXiaoWin = duLieuMap[item.numTe] || '';
                        let resStrWin = shengXiaoWin + item.numTe + '准';
                        let kyStr = String(item.kyNum).padStart(3, '0');
                        historyOutputs.push(`<p style="font-family:-apple-system-font,sans-serif;font-size:16px;"><span style="color:#333333;">${kyStr}期:</span><span style="color:rgb(255,0,255);">|绝杀二肖|</span><span style="color:rgb(0,128,0);">【<strong>${predicted}</strong>】</span><span style="color:#333333;">━开</span><span style="color:#008000;">:</span><span style="color:#ff0000;">${resStrWin}</span></p>`);
                    }
                }
            }
            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            // Đảm bảo tối thiểu luôn có 3 kỳ hiển thị:
            // - Tổng chỉ có 1 kỳ -> bù thêm 2 kỳ mặc định 發發
            // - Tổng số kỳ là 2 -> bù thêm 1 kỳ mặc định 發發
            // - Từ 3 kỳ trở lên -> không cần kỳ mặc định
            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = String(nextKyNum + 1).padStart(3, '0');
                let kyStr2 = String(nextKyNum + 2).padStart(3, '0');
                let defaultHtml1 = `<p style="font-family:-apple-system-font,sans-serif;font-size:16px;"><span style="color:#333333;">${kyStr1}期:</span><span style="color:rgb(255,0,255);">|绝杀二肖|</span><span style="color:rgb(0,128,0);">【<strong>發發</strong>】</span><span style="color:#333333;">━开</span><span style="color:#008000;">:</span><span style="color:#ff0000;">？00准</span></p>`;
                let defaultHtml2 = `<p style="font-family:-apple-system-font,sans-serif;font-size:16px;"><span style="color:#333333;">${kyStr2}期:</span><span style="color:rgb(255,0,255);">|绝杀二肖|</span><span style="color:rgb(0,128,0);">【<strong>發發</strong>】</span><span style="color:#333333;">━开</span><span style="color:#008000;">:</span><span style="color:#ff0000;">？00准</span></p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = String(nextKyNum + 1).padStart(3, '0');
                let defaultHtmlExtra = `<p style="font-family:-apple-system-font,sans-serif;font-size:16px;"><span style="color:#333333;">${kyStrExtra}期:</span><span style="color:rgb(255,0,255);">|绝杀二肖|</span><span style="color:rgb(0,128,0);">【<strong>發發</strong>】</span><span style="color:#333333;">━开</span><span style="color:#008000;">:</span><span style="color:#ff0000;">？00准</span></p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
