    function formatTwoDigits(val) {

        let actualCat = getDanShuangByNum('', animal);
        if (subZodiacs.includes(animal)) return true;
        if (mainCat === actualCat) return true;
        return false;
    }

            if (hitSubZodiac) {
                let z1 = subZodiacs.charAt(0);
                let z2 = subZodiacs.charAt(1);
                let z1Html = (z1 === animal) ? `<span class="win-animal">${z1}</span>` : z1;
                let z2Html = (z2 === animal) ? `<span class="win-animal">${z2}</span>` : z2;
                subZodiacsHtml = z1Html + z2Html;
            } else if (mainCat === actualCat) {
                mainCatHtml = `<span class="win-animal">${mainCat}</span>`;
            }
        }

        return `${mainCatHtml}+${subZodiacsHtml}`;

            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p style="font-family:-apple-system-font,sans-serif;font-size:16px;"><span style="color:#333333;">${kyStr1}期:</span><span style="color:rgb(255,0,255);">|家野中特|</span><span style="color:rgb(0,128,0);">【<span style="color:rgb(0,128,0);">發發+發發</span></span><span style="color:rgb(0,153,0);">】━开:</span><span style="color:#ff0000;">？00准</span></p>`;
                let defaultHtml2 = `<p style="font-family:-apple-system-font,sans-serif;font-size:16px;"><span style="color:#333333;">${kyStr2}期:</span><span style="color:rgb(255,0,255);">|家野中特|</span><span style="color:rgb(0,128,0);">【<span style="color:rgb(0,128,0);">發發+發發</span></span><span style="color:rgb(0,153,0);">】━开:</span><span style="color:#ff0000;">？00准</span></p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p style="font-family:-apple-system-font,sans-serif;font-size:16px;"><span style="color:#333333;">${kyStrExtra}期:</span><span style="color:rgb(255,0,255);">|家野中特|</span><span style="color:rgb(0,128,0);">【<span style="color:rgb(0,128,0);">發發+發發</span></span><span style="color:rgb(0,153,0);">】━开:</span><span style="color:#ff0000;">？00准</span></p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
    initPredict();
</script>
