    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    function getPredictDanShuangForKy(kyNum) {
        if (STATIC_PREDICTIONS[kyNum]) {
            return STATIC_PREDICTIONS[kyNum];
        }
        let cycle = Math.floor((kyNum - 1) / 2);
        return cycle % 2 === 0 ? "单数" : "双数";
    }

    function getDanShuangByNum(numStr) {
        let num = parseInt(numStr, 10);
        if (isNaN(num)) return "";
        return num % 2 === 0 ? "双数" : "单数";
    }

    function formatTwoDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            constrows = rawKQ.table.rows;
            let parsedList = [];
            let maxKyNum = 0;

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined && String(r[7].v).trim() !== '' && String(r[7].v).trim() !== '00') {
                        numTeFormatted = formatTwoDigits(r[7].v);
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                        if (kyOnlyNum > maxKyNum) {
                            maxKyNum = kyOnlyNum;
                        }
                    }
                }
            }

            let doneList = [];
            let limitRange = Math.min(parsedList.length, 365);
            let startIndex = parsedList.length - limitRange;

            for (let i = startIndex; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '' && item.numTe !== '00';
                if (isDone) {
                    doneList.push(item);
                }
            }

            let consecutiveMisses = 0;
            let cutoffIndex = doneList.length;

            for (let i = doneList.length - 1; i >= 0; i--) {
                let item = doneList[i];
                let predicted = getPredictDanShuangForKy(item.kyNum);
                let actual = getDanShuangByNum(item.numTe);
                let isValidNum = duLieuMap.hasOwnProperty(item.numTe);
                let isWin = isValidNum && actual && (predicted === actual);

                if (!isWin) {
                    consecutiveMisses++;
                    if (consecutiveMisses >= 3) {
                        cutoffIndex = i;
                        break;
                    }
                } else {
                    consecutiveMisses = 0;
                }
            }

            let nextKyNum = maxKyNum + 1;
            let kyStrNext = String(nextKyNum).padStart(3, '0');
            let predictNext = getPredictDanShuangForKy(nextKyNum);

            let htmlNextKy = `<pre style="font-size:16px;font-family:Arial,Helvetica,sans-serif;margin-bottom:20px;">${kyStrNext}期:精准单双【<span style="color:#ff0000;">${predictNext}</span>】<span style="color:rgb(0,255,0);">†</span>开:<span style="color:rgb(255,0,0);">？00准</span> </pre>`;

            let finalOutputs = [];

            let checkLatestMisses = 0;
            let winCountLastTwo = 0;
            let evaluatedDoneList = [];

            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predicted = getPredictDanShuangForKy(item.kyNum);
                let actual = getDanShuangByNum(item.numTe);
                let isValidNum = duLieuMap.hasOwnProperty(item.numTe);
                let isWin = isValidNum && actual && (predicted === actual);
                evaluatedDoneList.push({ item, isWin });
            }

            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                    if (checkLatestMisses >= 3) {
                        cutoffIndex = i + 1;
                        break;
                    }
                } else {
                    checkLatestMisses = 0;
                }
            }

            // Tính số kì trúng liên tiếp ở cuối danh sách (tính từ kì mới nhất ngược lại)
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (evaluatedDoneList[i].isWin) {
                    winCountLastTwo++;
                } else {
                    break;
                }
            }

            if (checkLatestMisses >= 3) {
                let nextKyNum2 = nextKyNum + 1;
                let nextKyNum3 = nextKyNum + 2;
                let kyStr2 = String(nextKyNum2).padStart(3, '0');
                let kyStr3 = String(nextKyNum3).padStart(3, '0');

                let predictNext2 = getPredictDanShuangForKy(nextKyNum2);
                let predictNext3 = getPredictDanShuangForKy(nextKyNum3);

                let defaultHtml2 = `<pre style="font-size:16px;font-family:Arial,Helvetica,sans-serif;margin-bottom:20px;">${kyStr2}期:精准单双【<span style="color:#ff0000;">${predictNext2}</span>】<span style="color:rgb(0,255,0);">†</span>开:<span style="color:rgb(255,0,0);">？00准</span> </pre>`;
                let defaultHtml3 = `<pre style="font-size:16px;font-family:Arial,Helvetica,sans-serif;margin-bottom:20px;">${kyStr3}期:精准单双【<span style="color:#ff0000;">${predictNext3}</span>】<span style="color:rgb(0,255,0);">†</span>开:<span style="color:rgb(255,0,0);">？00准</span> </pre>`;

                finalOutputs.push(defaultHtml3);
                finalOutputs.push(defaultHtml2);
                finalOutputs.push(htmlNextKy);
            } else {
                let historyOutputs = [];
                for (let i = cutoffIndex; i < doneList.length; i++) {
                    let item = doneList[i];
                    let predicted = getPredictDanShuangForKy(item.kyNum);
                    let shengXiaoWin = duLieuMap[item.numTe] || '';
                    let actual = getDanShuangByNum(item.numTe);
                    let isValidNum = duLieuMap.hasOwnProperty(item.numTe);
                    let isWin = isValidNum && actual && (predicted === actual);

                    if (isWin) {
                        let resStrWin = shengXiaoWin + item.numTe + '中';
                        let kyStr = String(item.kyNum).padStart(3, '0');
                        
                        let formattedPredictHtml = `<span style="color:#FF0000; background-color:yellow;">${predicted}</span>`;
                        
                        historyOutputs.push(`<pre style="font-size:16px;font-family:Arial,Helvetica,sans-serif;margin-bottom:20px;">${kyStr}期:精准单双【${formattedPredictHtml}】<span style="color:rgb(0,255,0);">†</span>开:<span style="color:rgb(255,0,0);">${resStrWin}</span> </pre>`);
                    }
                }
                historyOutputs.reverse();
                
                finalOutputs = [htmlNextKy, ...historyOutputs];

                if (winCountLastTwo === 0) {
                    let extraKyNum1 = nextKyNum + 1;
                    let extraKyNum2 = nextKyNum + 2;
                    let kyStr1 = String(extraKyNum1).padStart(3, '0');
                    let kyStr2 = String(extraKyNum2).padStart(3, '0');
                    let defaultHtml1 = `<pre style="font-size:16px;font-family:Arial,Helvetica,sans-serif;margin-bottom:20px;">${kyStr1}期:精准单双【<span style="color:#ff0000;">發發</span>】<span style="color:rgb(0,255,0);">†</span>开:<span style="color:rgb(255,0,0);">？00准</span> </pre>`;
                    let defaultHtml2 = `<pre style="font-size:16px;font-family:Arial,Helvetica,sans-serif;margin-bottom:20px;">${kyStr2}期:精准单双【<span style="color:#ff0000;">發發</span>】<span style="color:rgb(0,255,0);">†</span>开:<span style="color:rgb(255,0,0);">？00准</span> </pre>`;
                    finalOutputs.unshift(defaultHtml2);
                    finalOutputs.unshift(defaultHtml1);
                } else if (winCountLastTwo === 1) {
                    let extraKyNum = nextKyNum + 1;
                    let extraKyStr = String(extraKyNum).padStart(3, '0');
                    let defaultHtmlExtra = `<pre style="font-size:16px;font-family:Arial,Helvetica,sans-serif;margin-bottom:20px;">${extraKyStr}期:精准单双【<span style="color:#ff0000;">發發</span>】<span style="color:rgb(0,255,0);">†</span>开:<span style="color:rgb(255,0,0);">？00准</span> </pre>`;
                    finalOutputs.unshift(defaultHtmlExtra);
                }
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
    initPredict();
